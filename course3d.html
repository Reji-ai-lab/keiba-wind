<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>HATAKE コース起伏 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eef2f5;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:#33383d;overflow:hidden}
#hud{position:fixed;top:12px;left:12px;z-index:10;background:rgba(255,255,255,.94);border:1px solid #e4e8ec;border-radius:12px;padding:12px 14px;box-shadow:0 3px 12px rgba(60,90,110,.12);max-width:280px}
#hud h1{font-size:14px;color:#2f7d2b;font-weight:800;letter-spacing:.06em}
#hud .m{font-size:11px;font-weight:700;margin:5px 0 9px;line-height:1.5}
#hud select{width:100%;padding:8px;border:1px solid #dfe6ec;border-radius:8px;font-size:13px;font-weight:700;color:#33383d;background:#fff}
#hud label{display:block;font-size:10.5px;color:#8b9198;font-weight:700;margin:11px 0 3px}
#hud input[type=range]{width:100%}
#hud .lg{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;font-weight:700}
#hud .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#hud .tip{font-size:10px;color:#b0b6bc;margin-top:9px;line-height:1.7}
#cv{position:fixed;inset:0;touch-action:none;cursor:grab}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:13px;color:#c0392b;padding:30px;text-align:center}
</style></head><body>
<div id="hud">
  <h1>HATAKE コース起伏 3D</h1>
  <div class="m" id="meta"></div>
  <select id="sel"></select>
  <label>高低の強調 <span id="exv"></span>x</label>
  <input type="range" id="ex" min="4" max="26" step="1" value="13">
  <div class="lg"><span><i style="background:#4f8a34"></i>芝</span><span><i style="background:#c08a4a"></i>ダート</span><span><i style="background:#2f7d2b;border-radius:50%"></i>S</span><span><i style="background:#e5811f;border-radius:50%"></i>G</span></div>
  <div class="tip">指でドラッグ＝回転／2本指ピンチ＝ズーム（PCはドラッグ回転・ホイールズーム）。高低は強調表示。JRA公式データに基づく／HATAKE独自作図。</div>
</div>
<canvas id="cv"></canvas>
<div id="err">3Dの読み込みに失敗しました。通信環境を変えて再読み込みしてください。</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
var VENUES = {"札幌": {"芝": {"points": [[2000, 0.2], [1700, 0.4], [1400, 0.6], [1100, 0.65], [850, 0.55], [600, 0.4], [400, 0.25], [262.1, 0.15], [120, 0.05], [0, 0.0]], "straight": 262.1, "kotei": 0.7}, "ダート": {"points": [[1700, 0.2], [1450, 0.5], [1200, 0.75], [950, 0.8], [700, 0.6], [500, 0.4], [264.3, 0.2], [120, 0.05], [0, 0.0]], "straight": 264.3, "kotei": 0.9}}, "函館": {"芝": {"points": [[2000, 0.6], [1750, 1.4], [1500, 2.6], [1300, 3.4], [1100, 3.0], [900, 2.0], [650, 1.0], [400, 0.5], [262.1, 0.3], [120, 0.15], [0, 0.0]], "straight": 262.1, "kotei": 3.5}, "ダート": {"points": [[1700, 0.6], [1450, 1.5], [1200, 2.7], [1000, 3.4], [800, 2.9], [600, 1.8], [400, 0.8], [260.3, 0.3], [120, 0.15], [0, 0.0]], "straight": 260.3, "kotei": 3.5}}, "福島": {"芝": {"points": [[2000, 0.6], [1750, 1.2], [1500, 1.7], [1250, 1.9], [1000, 1.5], [750, 0.9], [500, 0.5], [292, 0.3], [150, 0.2], [0, 0.1]], "straight": 292, "kotei": 1.9}, "ダート": {"points": [[1700, 0.6], [1450, 1.3], [1200, 1.9], [1000, 2.1], [800, 1.6], [550, 0.9], [400, 0.5], [295.7, 0.3], [120, 0.15], [0, 0.1]], "straight": 295.7, "kotei": 2.1}}, "新潟": {"芝": {"points": [[2000, 0.4], [1700, 0.9], [1400, 1.6], [1100, 2.0], [900, 2.1], [750, 1.9], [658.7, 1.0], [500, 0.4], [250, 0.1], [0, 0.0]], "straight": 658.7, "kotei": 2.2}, "ダート": {"points": [[1800, 0.15], [1550, 0.35], [1300, 0.5], [1050, 0.55], [800, 0.45], [550, 0.3], [353.9, 0.15], [150, 0.05], [0, 0.0]], "straight": 353.9, "kotei": 0.6}}, "東京": {"芝": {"points": [[2000, 1.2], [1750, 2.2], [1550, 2.6], [1300, 2.0], [1000, 1.2], [800, 0.8], [600, 0.6], [525.9, 0.5], [300, 1.4], [120, 2.0], [0, 1.5]], "straight": 525.9, "kotei": 2.7}, "ダート": {"points": [[1600, 1.4], [1400, 2.0], [1200, 2.4], [1000, 1.9], [800, 1.3], [650, 0.9], [501.6, 0.6], [300, 1.4], [120, 2.0], [0, 1.5]], "straight": 501.6, "kotei": 2.5}}, "中山": {"芝": {"points": [[2000, 2.6], [1800, 4.2], [1600, 5.0], [1400, 4.4], [1150, 2.6], [900, 1.2], [700, 0.6], [500, 0.3], [310, 0.2], [180, 2.4], [60, 3.0], [0, 2.2]], "straight": 310, "kotei": 5.3}, "ダート": {"points": [[1800, 3.6], [1600, 4.4], [1400, 3.8], [1150, 2.4], [900, 1.3], [700, 0.7], [500, 0.4], [308, 0.3], [180, 2.2], [60, 2.7], [0, 2.0]], "straight": 308, "kotei": 4.5}}, "中京": {"芝": {"points": [[2000, 2.0], [1750, 2.6], [1500, 3.0], [1250, 2.2], [950, 1.2], [700, 0.6], [500, 0.4], [412.5, 0.4], [230, 2.2], [90, 2.8], [0, 2.0]], "straight": 412.5, "kotei": 3.5}, "ダート": {"points": [[1800, 1.9], [1550, 2.5], [1300, 2.9], [1050, 2.1], [800, 1.2], [600, 0.7], [410.7, 0.4], [220, 2.1], [80, 2.7], [0, 2.0]], "straight": 410.7, "kotei": 3.4}}, "京都": {"芝": {"points": [[2200, 1.0], [1900, 1.6], [1650, 2.2], [1400, 3.6], [1250, 4.0], [1100, 3.5], [950, 2.0], [750, 0.9], [550, 0.4], [403.7, 0.2], [200, 0.1], [0, 0.0]], "straight": 403.7, "kotei": 4.3}, "ダート": {"points": [[1800, 1.0], [1550, 1.7], [1300, 2.6], [1150, 3.0], [1000, 2.5], [800, 1.5], [550, 0.7], [329.1, 0.3], [150, 0.15], [0, 0.0]], "straight": 329.1, "kotei": 3.0}}, "阪神": {"芝": {"points": [[2000, 1.0], [1750, 1.4], [1500, 1.6], [1250, 1.3], [1000, 0.9], [750, 0.6], [550, 0.4], [356.5, 0.3], [200, 1.4], [70, 1.8], [0, 1.2]], "straight": 356.5, "kotei": 1.9}, "ダート": {"points": [[1800, 0.8], [1550, 1.2], [1300, 1.4], [1050, 1.1], [800, 0.7], [550, 0.4], [352.7, 0.3], [200, 1.2], [70, 1.5], [0, 1.0]], "straight": 352.7, "kotei": 1.6}}, "小倉": {"芝": {"points": [[2000, 1.2], [1750, 2.2], [1500, 2.9], [1250, 2.6], [1000, 1.8], [700, 0.9], [500, 0.5], [293, 0.3], [150, 0.2], [0, 0.0]], "straight": 293, "kotei": 3.0}, "ダート": {"points": [[1700, 1.1], [1450, 2.1], [1200, 2.8], [1000, 2.5], [750, 1.6], [500, 0.8], [291.3, 0.4], [150, 0.2], [0, 0.05]], "straight": 291.3, "kotei": 2.9}}};
var renderer,scene,camera,group,EX=13;
var az=0.85, pol=0.78, rad=430, target=new THREE.Vector3(0,14,0);
function updateCam(){
  pol=Math.max(0.12,Math.min(1.5,pol)); rad=Math.max(180,Math.min(900,rad));
  camera.position.set(target.x+rad*Math.sin(pol)*Math.sin(az), target.y+rad*Math.cos(pol), target.z+rad*Math.sin(pol)*Math.cos(az));
  camera.lookAt(target);
}
function resample(points,N){
  var p=points.slice().sort(function(a,b){return a[0]-b[0];}),d0=p[0][0],d1=p[p.length-1][0],out=[];
  for(var i=0;i<N;i++){var d=d0+(d1-d0)*i/(N-1),j=0;while(j<p.length-1&&p[j+1][0]<d)j++;
    var a=p[j],b=p[Math.min(j+1,p.length-1)],t=(b[0]===a[0])?0:(d-a[0])/(b[0]-a[0]);out.push([d,a[1]+(b[1]-a[1])*t]);}
  return out;
}
// 立体の帯(外周/内周の楕円間・厚みあり・上面は起伏)。frac 0=発走 → 1=ゴール(奥から手前へ一周)
function band(prof, aO,bO, aI,bI, isDirt, baseY){
  var N=180, rs=resample(prof.points,N);
  var emin=1e9,emax=-1e9; rs.forEach(function(q){emin=Math.min(emin,q[1]);emax=Math.max(emax,q[1]);});
  var c1=new THREE.Color(isDirt?0xe0c8a0:0xa9d488), c2=new THREE.Color(isDirt?0x8a5a2b:0x2f7d2b);
  var pos=[],col=[],idx=[];
  function ptCol(y){var t=(emax>emin)?(y-emin)/(emax-emin):0.5;var c=c1.clone().lerp(c2,t);return [c.r,c.g,c.b];}
  for(var i=0;i<N;i++){
    var frac=i/(N-1), th=Math.PI*1.5-frac*Math.PI*2;
    var ox=Math.cos(th)*aO, oz=Math.sin(th)*bO, ix=Math.cos(th)*aI, iz=Math.sin(th)*bI;
    var y=baseY+ rs[i][1]*EX + 6;                 // 上面(起伏)  +6=最低でも厚み確保
    var cc=ptCol(rs[i][1]);
    // 4頂点: TO(外上) TI(内上) BO(外下) BI(内下)
    pos.push(ox,y,oz); col.push(cc[0],cc[1],cc[2]);       // TO  (i*4+0)
    pos.push(ix,y,iz); col.push(cc[0],cc[1],cc[2]);       // TI  (i*4+1)
    var wc=[cc[0]*0.72,cc[1]*0.72,cc[2]*0.72];            // 側面は少し暗く
    pos.push(ox,baseY,oz); col.push(wc[0],wc[1],wc[2]);   // BO  (i*4+2)
    pos.push(ix,baseY,iz); col.push(wc[0],wc[1],wc[2]);   // BI  (i*4+3)
  }
  for(var i=0;i<N-1;i++){var a=i*4,b=(i+1)*4;
    idx.push(a,a+1,b+1, a,b+1,b);          // 上面
    idx.push(a,a+2,b+2, a,b+2,b);          // 外側面
    idx.push(a+1,b+1,b+3, a+1,b+3,a+3);    // 内側面
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:0.92,flatShading:false}));
}
function ellipseMesh(a,b,y,color){
  var s=new THREE.Shape();
  for(var t=0;t<=64;t++){var th=t/64*Math.PI*2,x=Math.cos(th)*a,z=Math.sin(th)*b; if(t===0)s.moveTo(x,z); else s.lineTo(x,z);}
  var geo=new THREE.ShapeGeometry(s); geo.rotateX(-Math.PI/2); geo.translate(0,y,0);
  return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:color,roughness:1,side:THREE.DoubleSide}));
}
function badge(x,y,z,letter,color){
  var cvs=document.createElement('canvas');cvs.width=cvs.height=128;var g=cvs.getContext('2d');
  g.beginPath();g.arc(64,64,52,0,Math.PI*2);g.fillStyle=color;g.fill();g.lineWidth=9;g.strokeStyle='#fff';g.stroke();
  g.fillStyle='#fff';g.font='bold 76px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(letter,64,72);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cvs),depthTest:false}));
  sp.position.set(x,y+16,z);sp.scale.set(24,24,1);group.add(sp);
}
function midTop(aO,bO,aI,bI,frac,y){var th=Math.PI*1.5-frac*Math.PI*2;
  return [(Math.cos(th)*aO+Math.cos(th)*aI)/2, y, (Math.sin(th)*bO+Math.sin(th)*bI)/2];}
function build(venue){
  var vd=VENUES[venue];
  var parts=[]; if(vd['芝'])parts.push('芝 高低差'+vd['芝'].kotei+'m'); if(vd['ダート'])parts.push('ダート 高低差'+vd['ダート'].kotei+'m');
  document.getElementById('meta').innerHTML='<b style="color:#2f7d2b">'+venue+'</b>　'+parts.join('／');
  if(group) scene.remove(group);
  group=new THREE.Group();
  var baseY=-10;
  // 地面ベース(全体を乗せる薄い台)
  group.add(ellipseMesh(200,132,baseY-1,0xdfe6dc));
  // 芝(外周・緑) / ダート(内周・茶)
  if(vd['芝'])  group.add(band(vd['芝'],  178,116, 150,98, false, baseY));
  if(vd['ダート']) group.add(band(vd['ダート'],146,95, 124,80, true, baseY));
  // 内馬場(芝生)
  group.add(ellipseMesh(120,77,baseY+2,0xbfe0a8));
  // S/G(芝の周回上に)
  var ref=vd['芝']||vd['ダート'];
  var pd=ref.points.slice().sort(function(a,b){return b[0]-a[0];}); // desc:[0]=発走
  var eS=baseY+pd[0][1]*EX+6, eG=baseY+pd[pd.length-1][1]*EX+6;
  var oa=vd['芝']?178:146, ob=vd['芝']?116:95, ia=vd['芝']?150:124, ib=vd['芝']?98:80;
  var S=midTop(oa,ob,ia,ib,0,eS), G=midTop(oa,ob,ia,ib,1,eG);
  badge(S[0],S[1],S[2],'S','#2f7d2b'); badge(G[0],G[1],G[2],'G','#e5811f');
  scene.add(group);
}
function init(){
  if(!window.THREE){document.getElementById('err').style.display='flex';return;}
  var cv=document.getElementById('cv');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0xeef2f5,1);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,4000);
  scene.add(new THREE.AmbientLight(0xffffff,0.72));
  var d=new THREE.DirectionalLight(0xffffff,0.7); d.position.set(140,240,120); scene.add(d);
  var d2=new THREE.DirectionalLight(0xffffff,0.32); d2.position.set(-140,150,-140); scene.add(d2);
  var drag=false,lx=0,ly=0,pd=0,twoTouch=false;
  cv.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch'){drag=true;lx=e.clientX;ly=e.clientY;}});
  window.addEventListener('pointermove',function(e){if(!drag)return;az-=(e.clientX-lx)*0.008;pol-=(e.clientY-ly)*0.008;lx=e.clientX;ly=e.clientY;updateCam();});
  window.addEventListener('pointerup',function(){drag=false;});
  cv.addEventListener('wheel',function(e){e.preventDefault();rad*=(e.deltaY>0?1.1:0.9);updateCam();},{passive:false});
  function tdist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  cv.addEventListener('touchstart',function(e){if(e.touches.length===1){twoTouch=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){twoTouch=true;pd=tdist(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',function(e){e.preventDefault();
    if(e.touches.length===2){var d=tdist(e.touches);if(pd)rad*=pd/d;pd=d;updateCam();}
    else if(e.touches.length===1&&!twoTouch){var t=e.touches[0];az-=(t.clientX-lx)*0.008;pol-=(t.clientY-ly)*0.008;lx=t.clientX;ly=t.clientY;updateCam();}},{passive:false});
  cv.addEventListener('touchend',function(e){if(e.touches.length===0){twoTouch=false;pd=0;}});
  var sel=document.getElementById('sel');
  Object.keys(VENUES).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);});
  sel.onchange=function(){build(sel.value);};
  document.getElementById('ex').oninput=function(e){EX=+e.target.value;document.getElementById('exv').textContent=EX;build(sel.value);};
  document.getElementById('exv').textContent=EX;
  var q=new URLSearchParams(location.search).get('c'); var k=(q&&VENUES[q])?q:Object.keys(VENUES)[0];
  sel.value=k; build(k); updateCam(); animate();
}
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}
addEventListener('resize',function(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
init();
</script></body></html>
