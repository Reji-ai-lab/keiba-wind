<style>
*{margin:0;padding:0;box-sizing:border-box}

</div>

], [0, 1.5]], "title": "阪神(外)・芝 ｜ コース起伏プロファイル"}, "福島": {"dist": 2000, "straight": 292, "kotei": 1.9, "surface": "芝", "points": [[2000, 0.6], [1750, 1.2], [1500, 1.7], [1250, 1.9], [1000, 1.5], [750, 0.9], [500, 0.5], [292, 0.3], [150, 0.2], [0, 0.1]], "title": "福島・芝 ｜ コース起伏プロファイル"}, "小倉": {"dist": 2000, "straight": 293, "kotei": 3.0, "surface": "芝", "points": [[2000, 1.2], [1750, 2.2], [1500, 2.9], [1250, 2.6], [1000, 1.8], [700, 0.9], [500, 0.5], [293, 0.3], [150, 0.2], [0, 0.0]], "title": "小倉・芝 ｜ コース起伏プロファイル"}, "札幌": {"dist": 2000, "straight": 262.1, "kotei": 0.7, "surface": "芝", "points": [[2000, 0.2], [1700, 0.4], [1400, 0.6], [1100, 0.65], [850, 0.55], [600, 0.4], [400, 0.25], [262.1, 0.15], [120, 0.05], [0, 0.0]], "title": "札幌・芝 ｜ コース起伏プロファイル"}, "函館": {"dist": 2000, "straight": 262.1, "kotei": 3.5, "surface": "芝", "points": [[2000, 0.6], [1750, 1.4], [1500, 2.6], [1300, 3.4], [1100, 3.0], [900, 2.0], [650, 1.0], [400, 0.5], [262.1, 0.3], [120, 0.15], [0, 0.0]], "title": "函館・芝 ｜ コース起伏プロファイル"}, "東京ダ": {"dist": 1600, "straight": 501.6, "kotei": 2.5, "surface": "ダート", "points": [[1600, 1.4], [1400, 2.0], [1200, 2.4], [1000, 1.9], [800, 1.3], [650, 0.9], [501.6, 0.6], [300, 1.4], [120, 2.0], [0, 1.5]], "title": "東京ダ・ダート ｜ コース起伏プロファイル"}, "中山ダ": {"dist": 1800, "straight": 308, "kotei": 4.5, "surface": "ダート", "points": [[1800, 3.6], [1600, 4.4], [1400, 3.8], [1150, 2.4], [900, 1.3], [700, 0.7], [500, 0.4], [308, 0.3], [180, 2.2], [60, 2.7], [0, 2.0]], "title": "中山ダ・ダート ｜ コース起伏プロファイル"}, "札幌ダ": {"dist": 1700, "straight": 264.3, "kotei": 0.9, "surface": "ダート", "points": [[1700, 0.2], [1450, 0.5], [1200, 0.75], [950, 0.8], [700, 0.6], [500, 0.4], [264.3, 0.2], [120, 0.05], [0, 0.0]], "title": "札幌ダ・ダート ｜ コース起伏プロファイル"}, "函館ダ": {"dist": 1700, "straight": 260.3, "kotei": 3.5, "surface": "ダート", "points": [[1700, 0.6], [1450, 1.5], [1200, 2.7], [1000, 3.4], [800, 2.9], [600, 1.8], [400, 0.8], [260.3, 0.3], [120, 0.15], [0, 0.0]], "title": "函館ダ・ダート ｜ コース起伏プロファイル"}, "福島ダ": {"dist": 1700, "straight": 295.7, "kotei": 2.1, "surface": "ダート", "points": [[1700, 0.6], [1450, 1.3], [1200, 1.9], [1000, 2.1], [800, 1.6], [550, 0.9], [400, 0.5], [295.7, 0.3], [120, 0.15], [0, 0.1]], "title": "福島ダ・ダート ｜ コース起伏プロファイル"}, "新潟ダ": {"dist": 1800, "straight": 353.9, "kotei": 0.6, "surface": "ダート", "points": [[1800, 0.15], [1550, 0.35], [1300, 0.5], [1050, 0.55], [800, 0.45], [550, 0.3], [353.9, 0.15], [150, 0.05], [0, 0.0]], "title": "新潟ダ・ダート ｜ コース起伏プロファイル"}, "中京ダ": {"dist": 1800, "straight": 410.7, "kotei": 3.4, "surface": "ダート", "points": [[1800, 1.9], [1550, 2.5], [1300, 2.9], [1050, 2.1], [800, 1.2], [600, 0.7], [410.7, 0.4], [220, 2.1], [80, 2.7], [0, 2.0]], "title": "中京ダ・ダート ｜ コース起伏プロファイル"}, "京都ダ": {"dist": 1800, "straight": 329.1, "kotei": 3.0, "surface": "ダート", "points": [[1800, 1.0], [1550, 1.7], [1300, 2.6], [1150, 3.0], [1000, 2.5], [800, 1.5], [550, 0.7], [329.1, 0.3], [150, 0.15], [0, 0.0]], "title": "京都ダ・ダート ｜ コース起伏プロファイル"}, "阪神ダ": {"dist": 1800, "straight": 352.7, "kotei": 1.6, "surface": "ダート", "points": [[1800, 0.8], [1550, 1.2], [1300, 1.4], [1050, 1.1], [800, 0.7], [550, 0.4], [352.7, 0.3], [200, 1.2], [70, 1.5], [0, 1.0]], "title": "阪神ダ・ダート ｜ コース起伏プロファイル"}, "小倉ダ": {"dist": 1700, "straight": 291.3, "kotei": 2.9, "surface": "ダート", "points": [[1700, 1.1], [1450, 2.1], [1200, 2.8], [1000, 2.5], [750, 1.6], [500, 0.8], [291.3, 0.4], [150, 0.2], [0, 0.05]], "title": "小倉ダ・ダート ｜ コース起伏プロファイル"}};
var renderer,scene,camera,trackGroup,EX=9;
var az=0.7, pol=0.95, rad=340, target=new THREE.Vector3(0,6,0);
function updateCam(){
  pol=Math.max(0.12,Math.min(1.52,pol)); rad=Math.max(140,Math.min(760,rad));
  camera.position.set(target.x+rad*Math.sin(pol)*Math.sin(az), target.y+rad*Math.cos(pol), target.z+rad*Math.sin(pol)*Math.cos(az));
  camera.lookAt(target);
}
function init(){
  if(!window.THREE){document.getElementById('err').style.display='flex';return;}
  var cv=document.getElementById('cv');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0xffffff,1);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,3000);
  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  var d=new THREE.DirectionalLight(0xffffff,0.65); d.position.set(120,220,90); scene.add(d);
  var d2=new THREE.DirectionalLight(0xffffff,0.3); d2.position.set(-110,130,-130); scene.add(d2);
  var grid=new THREE.GridHelper(620,31,0xe4e8ec,0xeef1f4); grid.position.y=-2; scene.add(grid);
  var drag=false,lx=0,ly=0,pd=0,twoTouch=false;
  cv.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch'){drag=true;lx=e.clientX;ly=e.clientY;}});
  window.addEventListener('pointermove',function(e){if(!drag)return;az-=(e.clientX-lx)*0.008;pol-=(e.clientY-ly)*0.008;lx=e.clientX;ly=e.clientY;updateCam();});
  window.addEventListener('pointerup',function(){drag=false;});
  cv.addEventListener('wheel',function(e){e.preventDefault();rad*=(e.deltaY>0?1.1:0.9);updateCam();},{passive:false});
  function tdist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  cv.addEventListener('touchstart',function(e){if(e.touches.length===1){twoTouch=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){twoTouch=true;pd=tdist(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',function(e){e.preventDefault();
    if(e.touches.length===2){var d=tdist(e.touches);if(pd)rad*=pd/d;pd=d;updateCam();}
    else if(e.touches.length===1&&!twoTouch){var t=e.touches[0];az-=(t.clientX-lx)*0.008;pol-=(t.clientY-ly)*0.008;lx=t.clientX;ly=t.clientY;updateCam();}},{passive:false});
  cv.addEventListener('touchend',function(e){if(e.touches.length===0){twoTouch=false;pd=0;}});
  var sel=document.getElementById('sel');
  Object.keys(PROFILES).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);});
  sel.onchange=function(){build(sel.value);};
  document.getElementById('ex').oninput=function(e){EX=+e.target.value;document.getElementById('exv').textContent=EX;build(sel.value);};
  document.getElementById('exv').textContent=EX;
  var q=new URLSearchParams(location.search).get('c'); var k=(q&&PROFILES[q])?q:Object.keys(PROFILES)[0];
  sel.value=k; build(k); updateCam(); animate();
}
function resample(points,N){
  var p=points.slice().sort(function(a,b){return a[0]-b[0];}),d0=p[0][0],d1=p[p.length-1][0],out=[];
  for(var i=0;i<N;i++){var d=d0+(d1-d0)*i/(N-1),j=0;while(j<p.length-1&&p[j+1][0]<d)j++;
    var a=p[j],b=p[Math.min(j+1,p.length-1)],t=(b[0]===a[0])?0:(d-a[0])/(b[0]-a[0]);out.push([d,a[1]+(b[1]-a[1])*t]);}
  return out;
}
function badge(x,y,z,letter,color){
  var cvs=document.createElement('canvas');cvs.width=cvs.height=128;var g=cvs.getContext('2d');
  g.beginPath();g.arc(64,64,52,0,Math.PI*2);g.fillStyle=color;g.fill();g.lineWidth=9;g.strokeStyle='#fff';g.stroke();
  g.fillStyle='#fff';g.font='bold 76px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(letter,64,72);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cvs),depthTest:false}));
  sp.position.set(x,y+15,z);sp.scale.set(22,22,1);trackGroup.add(sp);
}
function build(key){
  var pr=PROFILES[key],isDirt=pr.surface==='ダート';
  var mt=document.getElementById('meta');mt.textContent=(isDirt?'ダート':'芝')+'／高低差 '+pr.kotei+'m ／ 直線 '+Math.round(pr.straight)+'m（JRA公式）';
  mt.style.color=isDirt?'#8a5a2b':'#2f7d2b';
  if(trackGroup) scene.remove(trackGroup);
  trackGroup=new THREE.Group();
  var N=170,rs=resample(pr.points,N),a=155,b=100,W=14,vpos=[],idx=[],cols=[];
  var emin=1e9,emax=-1e9;rs.forEach(function(q){emin=Math.min(emin,q[1]);emax=Math.max(emax,q[1]);});
  var c1=new THREE.Color(isDirt?0xd9c199:0x9fd18f),c2=new THREE.Color(isDirt?0x6f4620:0x256321);
  for(var i=0;i<N;i++){
    var frac=i/(N-1),th=Math.PI*1.5-frac*Math.PI*2,cx=Math.cos(th)*a,cz=Math.sin(th)*b;
    var dth=0.001,nx=Math.cos(th+dth)*a-cx,nz=Math.sin(th+dth)*b-cz,L=Math.hypot(nx,nz)||1,px=-nz/L,pz=nx/L,y=rs[i][1]*EX;
    vpos.push(cx+px*W,y,cz+pz*W);vpos.push(cx-px*W,y,cz-pz*W);
    var t=(emax>emin)?(rs[i][1]-emin)/(emax-emin):0,c=c1.clone().lerp(c2,t);
    cols.push(c.r,c.g,c.b,c.r,c.g,c.b);
  }
  for(var i=0;i<N-1;i++){var o=i*2;idx.push(o,o+1,o+2,o+1,o+3,o+2);}
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(vpos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  g.setIndex(idx);g.computeVertexNormals();
  trackGroup.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:0.9})));
  var lp=[];for(var i=0;i<N;i++){var o=i*2;lp.push(new THREE.Vector3((vpos[o*3]+vpos[o*3+3])/2,vpos[o*3+1]+0.5,(vpos[o*3+2]+vpos[o*3+5])/2));}
  trackGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lp),new THREE.LineBasicMaterial({color:0xffffff})));
  function at(i){var o=i*2*3;return [(vpos[o]+vpos[o+3])/2,vpos[o+1],(vpos[o+2]+vpos[o+5])/2];}
  var s=at(0),gg=at(N-1); badge(s[0],s[1],s[2],'S','#2f7d2b'); badge(gg[0],gg[1],gg[2],'G','#e5811f');
  scene.add(trackGroup);
}
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}
addEventListener('resize',function(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
init();
</script></body></html>
