  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#0d1b2a; --ink2:#5c7a99; --ink3:#8899aa;
    --line:#dfe6ec; --line2:#f0f2f5;
    --green:#00866e; --green-deep:#006d5a; --emerald:#00b894; --green-lt:#e1f5ee;
    --gold:#ba7517; --orange:#d85a30; --red:#e74c3c; --cream:#fff8e1; --wind:#5c7a99;
    --front:#00866e; --back:#d85a30; --inner:#5c7a99; --outer:#ba7517;
  }
  :root[data-theme="dark"]{--bg:#f4f6f8;--card:#ffffff;--ink:#0d1b2a;--ink2:#5c7a99;--ink3:#8899aa;--line:#dfe6ec;--line2:#f0f2f5;--green:#00866e;--green-deep:#006d5a;--emerald:#00b894;--green-lt:#e1f5ee;--gold:#ba7517;--orange:#d85a30;--red:#e74c3c;--cream:#fff8e1;--wind:#5c7a99;--front:#00866e;--back:#d85a30;--inner:#5c7a99;--outer:#ba7517;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:"MPlusRounded","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
    max-width:860px;margin:0 auto;padding:22px 18px 70px;}
  .tn{font-variant-numeric:tabular-nums;}
  /* header */
  .hd{text-align:center;padding:4px 0 15px;border-bottom:2px solid var(--emerald);margin-bottom:20px;}
  .hd .brand{font-size:12px;font-weight:800;letter-spacing:.34em;color:var(--green);}
  .hd .brand em{color:var(--ink3);font-style:normal;font-weight:600;}
  .hd h1{font-size:clamp(21px,4.5vw,27px);font-weight:800;letter-spacing:.05em;margin:9px 0 5px;}
  .hd .sub{font-size:11px;color:var(--ink2);letter-spacing:.12em;}
  .note{background:var(--cream);border:1px solid #eadfae;border-radius:8px;padding:8px 13px;font-size:11px;color:#7a6a3a;margin-bottom:16px;text-align:center;}
  .note b{color:var(--orange);}
  /* section card */
  .sec{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:15px;margin-bottom:14px;}
  .sec-t{font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:.22em;text-align:center;margin-bottom:13px;}
  .sec-t .r{color:var(--ink2);font-weight:400;letter-spacing:.04em;}
  /* course cells */
  .rail{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:var(--line);border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  @media(max-width:640px){.rail{grid-template-columns:repeat(5,1fr);}}
  .ct{background:var(--card);padding:9px 2px;text-align:center;cursor:pointer;transition:.12s;}
  .ct:hover{background:var(--green-lt);}
  .ct.on{background:var(--green);color:#fff;}
  .ct.on svg{color:#fff;} .ct.on .cp{color:rgba(255,255,255,.75);}
  .ct svg{width:15px;height:15px;color:var(--emerald);}
  .ct .nm{font-size:12.5px;font-weight:800;} .ct .cp{font-size:9px;color:var(--ink3);letter-spacing:.04em;}
  /* two col */
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;}
  .sec.wind{display:flex;flex-direction:column;margin-bottom:0;}
  .sec.wind .rose{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .rcol{display:flex;flex-direction:column;gap:14px;}
  .rcol>.sec{margin-bottom:0;}
  .sec.grow{flex:1;display:flex;flex-direction:column;justify-content:center;}
  @media(max-width:640px){.g2{grid-template-columns:1fr;}}
  .rose{background:linear-gradient(#fbfdfc,#eef4f2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .rose canvas{width:100%;max-width:220px;aspect-ratio:1;display:block;margin:0 auto;}
  .readout{text-align:center;margin-top:5px;}
  .readout .big{font-size:24px;font-weight:800;letter-spacing:.02em;}
  .readout .s{font-size:11px;color:var(--ink2);}
  .cinfo{text-align:center;font-size:11px;color:var(--ink2);margin:11px 0 3px;letter-spacing:.06em;}
  .cinfo b{color:var(--ink);font-size:15px;font-weight:800;letter-spacing:.04em;}
  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;margin-top:12px;}
  label{font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:.1em;display:block;margin-bottom:4px;}
  label .rv{float:right;color:var(--green);font-weight:800;letter-spacing:0;}
  select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;font-weight:700;}
  input[type=range]{width:100%;accent-color:var(--green);}
  /* meters */
  .met{margin:6px 0 2px;}

const cv=document.getElementById("rose"),g=cv.getContext("2d");

let W=0,H=0,t0=0;
function setup(){const dpr=window.devicePixelRatio||1,b=cv.getBoundingClientRect();W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);}
function draw(el){
  const cxp=W/2,cyp=H/2;g.clearRect(0,0,W,H);
  const line=css('--line'),ink3=css('--ink3'),green=css('--green');
  const th=rad(K[cur].br),cs=Math.cos(th),sn=Math.sin(th),L=W*0.30,Wd=W*0.135;
  const toS=(lx,ly)=>[cxp+lx*cs-ly*sn,cyp+lx*sn+ly*cs];
  g.fillStyle=ink3;g.font='bold 10px sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText("北",cxp,cyp-W*0.46);g.fillText("南",cxp,cyp+W*0.46);g.fillText("西",cxp-W*0.455,cyp);g.fillText("東",cxp+W*0.455,cyp);

  g.beginPath();g.moveTo(Wd,L-Wd*0.7);g.lineTo(Wd,-L+Wd*0.7);g.stroke();
  g.beginPath();g.moveTo(Wd-7,-L+Wd*0.7);g.lineTo(Wd+7,-L+Wd*0.7);g.stroke();

  g.strokeStyle=ink3;g.lineWidth=1.6;g.beginPath();g.moveTo(-Wd,-L+Wd*0.7);g.lineTo(-Wd,L-Wd*0.7);g.stroke();
  [-L*0.3,L*0.05,L*0.4].forEach(yy=>chev(-Wd,yy,1,5,ink3,2.6));
  g.restore();
  g.font='bold 10px sans-serif';let p=toS(Wd+16,0);g.fillStyle=green;g.fillText("直線",p[0],p[1]);
  p=toS(-Wd-18,0);g.fillStyle=ink3;g.fillText("向正面",p[0],p[1]);

function frLine(lab,e,fn){

function render(){
  document.querySelectorAll(".ct").forEach(t=>t.classList.toggle("on",+t.dataset.id===cur));
  const k=K[cur];

  const sV=e=>({t:e[0]>0?"向かい風で前残り":"追い風で前残り",c:e[0]>0?"var(--front)":"var(--back)"});
  const dV=e=>({t:e[0]>0?"風で有利な枠が来る":"効きは弱い／逆",c:e[0]>0?"var(--green)":"var(--ink3)"});
  const gS=e=>({t:e[0]>0?"道悪で前残り":"道悪で差し台頭",c:e[0]>0?"var(--front)":"var(--back)"});

  const cD=e=>({t:e[0]>0?"硬い芝で内枠有利":"硬い芝で外有利",c:"var(--ink)"});

function advise(){
  const k=K[cur],wd=+wdirEl.value,sp=+wspdEl.value,going=+goingEl.value,cush=+cushEl.value;
  const to=(wd+180)%360,along=sp*Math.cos(rad(to-k.br)),cross=sp*Math.sin(rad(to-k.br));
  const turn=TURN_L.includes(cur)?1:-1,co=cross*turn;
  let wl="横風";if(sp<1)wl="ほぼ無風";else if(Math.abs(along)>=Math.abs(cross))wl=along>0?"追い風":"向かい風";
  wLabel.textContent=wl;wLabel.style.color=sp<1?"var(--ink2)":(wl==="横風"?"var(--wind)":wl==="向かい風"?"var(--back)":"var(--front)");
  wSpd.textContent=sp>0?`${jp(wd)}より ${sp} m/s`:"無風";
  let mS=0,mD=0;const C=[],wg=e=>Math.min(e[1],2)/2;
  if(Math.abs(along)>=1.5&&Math.abs(along)>Math.abs(cross)&&k.ws){
    const v=(along<0?1:-1)*k.ws[0]*Math.min(Math.abs(along)/3,1);mS+=v*wg(k.ws);
    C.push([v,`${along<0?"向かい":"追い"}風 ${Math.abs(along).toFixed(1)}m → ${v>0?"前づけ":"差し"}やや有利`,mark(k.ws[1])]);}
  if(Math.abs(co)>=1.5&&k.wd){const v=-sgn(co)*k.wd[0]*Math.min(Math.abs(co)/3,1);mD+=v*wg(k.wd);
    C.push([v,`横風が${co<0?"内":"外"}へ ${Math.abs(co).toFixed(1)}m → ${v>0?"外":"内"}枠やや有利`,mark(k.wd[1])]);}
  if(going>=1){if(k.gs){mS+=k.gs[0]*wg(k.gs);C.push([k.gs[0],`道悪 → ${k.gs[0]>0?"前づけ":"差し"}有利`,mark(k.gs[1])]);}
    if(k.gd){mD+=-k.gd[0]*wg(k.gd);C.push([-k.gd[0],`道悪 → ${k.gd[0]>0?"内":"外"}枠有利`,mark(k.gd[1])]);}}

  if(Math.abs(dev)>=0.4){const h=dev>0?1:-1;
    if(k.cs){const v=h*k.cs[0];mS+=v*wg(k.cs);C.push([v,`${h>0?"硬い":"軟らかい"}芝 → ${v>0?"前づけ":"差し"}有利`,mark(k.cs[1])]);}
    if(k.cd){const v=-h*k.cd[0];mD+=v*wg(k.cd);C.push([v,`${h>0?"硬い":"軟らかい"}芝 → ${v>0?"外":"内"}枠有利`,mark(k.cd[1])]);}}
  pos("knS",mS);pos("knD",mD);
  const st=verb(mS,"逃げ・先行","差し・追込"),dt=verb(mD,"外枠","内枠");
  let html=`<div class="big">脚質は<b>${st}</b> ／ 枠は<b>${dt}</b></div>`;
  html+=C.length?`<div class="cbs">`+C.map(c=>{const col=c[0]>0?"var(--front)":"var(--back)";
    return `<div class="c"><span class="dot" style="background:${col}"></span><span>${c[1]} <span class="mk ${c[2][1]}">${c[2][0]}</span></span></div>`;}).join("")+`</div>`
    :`<div class="cbs"><span class="none">今日の条件では、この会場で目立った偏りは出ません（平常）。</span></div>`;
  vfin.innerHTML=html;
}
function verb(m,p,n){const a=Math.abs(m);if(a<0.4)return "偏りなし";return `${a<1.2?"やや":a<2.5?"":"はっきり"}${m>0?p:n}有利`;}
function pos(id,m){document.getElementById(id).style.left=(50+Math.max(-44,Math.min(44,m*9)))+"%";}

const wdirEl=document.getElementById("wdir"),wspdEl=document.getElementById("wspd"),
  goingEl=document.getElementById("going"),cushEl=document.getElementById("cush");
function syncCush(){cushEl.value=K[cur].cm;cushV.textContent=(+K[cur].cm).toFixed(1);}
wspdEl.oninput=e=>{wspdV.textContent=e.target.value+" m/s";drawRose();advise();};
cushEl.oninput=e=>{cushV.textContent=(+e.target.value).toFixed(1);advise();};
wdirEl.onchange=()=>{wdirV.textContent=jp(+wdirEl.value);drawRose();advise();};
goingEl.onchange=advise;
new ResizeObserver(()=>drawRose()).observe(cv);
t0=performance.now();syncCush();render();
if(!reduce)requestAnimationFrame(loop);
</script>
